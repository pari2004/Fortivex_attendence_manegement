{% load i18n static %}

<template id="companyIconTemplate">
    <div class="row mb-3">
        <div class="col-12 d-flex align-items-center">
            <div
                class="oh-profile-section__edit-photo me-4 mb-3"
                data-toggle="oh-modal-toggle"
                data-target="#companyIconModal"
                style="border: 1px solid hsl(213, 22%, 84%)"
            >
                <img
                    src="{% if form.instance.icon %}{{ form.instance.icon.url }}{% else %}{% static 'images/ui/auth-logo.png' %}{% endif %}"
                    class="oh-profile-section__avatar preview"
                    alt="{% trans 'Company logo' %}"
                >
            </div>
        </div>
    </div>
</template>

<div class="oh-modal" id="companyIconModal" role="dialog" aria-labelledby="companyIconModal" aria-hidden="true">
    <div class="oh-modal__dialog">
        <div class="oh-modal__dialog-header">
            <span class="oh-modal__dialog-title" id="companyIconModalLabel">{% trans "Upload Logo" %}</span>
            <button
                type="button"
                class="oh-modal__close"
                aria-label="{% trans 'Close' %}"
                onclick="event.stopImmediatePropagation(); $('#companyIconModal').removeClass('oh-modal--show');"
            >
                <ion-icon name="close-outline"></ion-icon>
            </button>
        </div>
        <div class="oh-modal__dialog-body">
            <div class="oh-profile-section__image-container" id="companyIconFieldContainer">
                <div class="oh-profile-section__modal-avatar" style="border: 1px solid hsl(213, 22%, 84%); max-height: 400px; width: 100%; display: flex; justify-content: center; align-items: center;">
                    <img
                        id="companyImageToCrop"
                        src="{% if form.instance.icon %}{{ form.instance.icon.url }}{% else %}{% static 'images/ui/auth-logo.png' %}{% endif %}"
                        class="preview"
                        style="max-width: 100%; max-height: 100%;"
                        alt="{% trans 'Company logo' %}"
                    >
                </div>
            </div>
            <div class="d-flex justify-content-end mt-4">
                <button type="button" id="cropCompanyIconBtn" class="oh-btn oh-btn--secondary oh-btn--small w-100" style="display: none;">{% trans "Crop & Save" %}</button>
            </div>
        </div>
    </div>
</div>

<style>
    #id_icon_parent_div {
        display: none !important;
    }
    /* Make the crop box circular */
    .cropper-view-box,
    .cropper-face {
      border-radius: 50%;
    }
    /* The cropper image needs to fit inside the container */
    .cropper-container {
        width: 100% !important;
    }
</style>

{% include "generic/horilla_form.html" %}

<script>
    (function () {
        var cropper = null;
        var image = document.getElementById('companyImageToCrop');
        var cropBtn = document.getElementById('cropCompanyIconBtn');

        function initCompanyIconField() {
            var iconInput = document.getElementById("id_icon");
            var fieldContainer = document.getElementById("companyIconFieldContainer");
            var modal = document.getElementById("companyIconModal");
            var template = document.getElementById("companyIconTemplate");
            if (!iconInput || !fieldContainer || !modal || !template) {
                return;
            }

            var formEl = iconInput.closest("form");
            var card = formEl ? formEl.querySelector(".oh-profile-section__card") : null;
            if (card && !card.querySelector(".oh-profile-section__edit-photo")) {
                card.insertBefore(template.content.cloneNode(true), card.firstChild);
            }
            var originalParentDiv = document.getElementById("id_icon_parent_div");
            var errorList = originalParentDiv ? originalParentDiv.querySelector(".errorlist") : null;

            if (iconInput.parentElement !== fieldContainer) {
                fieldContainer.appendChild(iconInput);
                if (formEl && formEl.id) {
                    iconInput.setAttribute("form", formEl.id);
                }
            }
            iconInput.classList.add("oh-input", "oh-input--file", "oh-input--file-sm", "mt-4");
            iconInput.required = false;

            if (errorList) {
                fieldContainer.appendChild(errorList);
                modal.classList.add("oh-modal--show");
            }

            iconInput.addEventListener("change", function (e) {
                var file = e.target.files[0];
                if (!file) {
                    return;
                }
                var reader = new FileReader();
                reader.addEventListener("load", function () {
                    // Destroy previous cropper if exists
                    if (cropper) {
                        cropper.destroy();
                    }
                    image.src = reader.result;
                    // Initialize cropper
                    cropper = new Cropper(image, {
                        aspectRatio: 1,
                        viewMode: 1,
                        background: false,
                    });
                    cropBtn.style.display = 'block';
                });
                reader.readAsDataURL(file);
            });

            // Handle Crop & Save
            cropBtn.addEventListener('click', function() {
                if (!cropper) return;
                
                // Get cropped canvas
                var canvas = cropper.getCroppedCanvas({
                    width: 400,
                    height: 400,
                });
                
                canvas.toBlob(function(blob) {
                    // Create a new file from the blob
                    var fileName = iconInput.files[0] ? iconInput.files[0].name : 'logo.png';
                    var file = new File([blob], fileName, { type: 'image/png', lastModified: new Date().getTime() });
                    
                    // Create a new DataTransfer object to assign the file to the input
                    var container = new DataTransfer();
                    container.items.add(file);
                    iconInput.files = container.files;
                    
                    // Update main UI preview (not the modal one)
                    var mainPreview = document.querySelector('.oh-profile-section__edit-photo .preview');
                    if (mainPreview) {
                        mainPreview.src = canvas.toDataURL('image/png');
                    }
                    
                    // Close the modal
                    $('#companyIconModal').removeClass('oh-modal--show');
                }, 'image/png');
            });
        }
        initCompanyIconField();
    })();
</script>
