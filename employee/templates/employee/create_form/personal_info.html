{% load i18n %}
<div class="oh-modal" id="badgeModal" role="dialog" aria-hidden="true">
    <div class="oh-modal__dialog" style="max-width: 550px">
        <div class="oh-modal__dialog-header">
            <button type="button" class="oh-modal__close" aria-label="{% trans 'Close' %}">
                <ion-icon name="close-outline"></ion-icon>
            </button>
        </div>

        <div class="oh-modal__dialog-body" id="badgeModalBody"></div>
    </div>
</div>
<div class="oh-wrapper" data-select2-id="select2-data-40-yu7x">
    <div class="oh-general__tab-target oh-profile-section mb-4" id="personal" data-select2-id="select2-data-personal">
        <div class="oh-profile-section__card" data-select2-id="select2-data-48-0df8">
            <form
                data-select2-id="select2-data-47-5jxy"
                method="post"
                action='{% url "employee-create-personal-info" %}'
                enctype="multipart/form-data"
            >
                {% csrf_token %}
                <div class="row">
                    <div class="col-12 col-sm-12 col-md-12 col-lg-6 d-flex align-items-center">
                        <div
                            class="oh-profile-section__edit-photo me-4 mb-3"
                            data-toggle="oh-modal-toggle"
                            data-target="#uploadPhotoModal"
                        >
                            <img
                                src="https://ui-avatars.com/api/?name=N+P&background=random"
                                class="oh-profile-section__avatar preview"
                                alt=""
                            >
                        </div>
                    </div>
                </div>
                {{ form.employee_profile.errors }}
                <div
                    class="oh-modal"
                    id="uploadPhotoModal"
                    role="dialog"
                    aria-labelledby="uploadPhotoModal"
                    aria-hidden="true"
                >
                    <div class="oh-modal__dialog">
                        <div class="oh-modal__dialog-header">
                            <span
                                class="oh-modal__dialog-title"
                                id="uploadPhotoModalLabel"
                            >{% trans "Upload Photo" %}</span>
                            <button class="oh-modal__close" aria-label="{% trans 'Close' %}">
                                <ion-icon name="close-outline"></ion-icon>
                            </button>
                        </div>
                        <div class="oh-modal__dialog-body">
                            <div class="oh-profile-section__image-container">
                                {% csrf_token %}
                                <div class="oh-profile-section__modal-avatar" style="max-height: 400px; width: 100%; display: flex; justify-content: center; align-items: center;">
                                    <img
                                        id="employeeImageToCrop"
                                        src="https://ui-avatars.com/api/?name=N+P&background=random"
                                        class="preview"
                                        style="max-width: 100%; max-height: 100%;"
                                        alt="{% trans 'Employee' %}"
                                    >
                                </div>
                                {{ form.employee_profile }}
                            </div>
                            <div class="d-flex justify-content-end mt-4">
                                <button type="button" id="cropEmployeeIconBtn" class="oh-btn oh-btn--secondary oh-btn--small w-100" style="display: none;">{% trans "Crop & Save" %}</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-12 col-sm-12 col-md-12 col-lg-6">
                        <label class="oh-label" for="firstname">{% trans "Badge Id" %}
                            <div
                                hx-get="{% url 'get-first-last-badge-id' %}"
                                hx-target="#badgeModalBody"
                                data-target="#badgeModal"
                                data-toggle="oh-modal-toggle"
                                class="oh-checkpoint-badge text-success mb-2"
                                id="selectAllInstances"
                                style="cursor: pointer"
                            >
                                {% trans "Show" %}
                            </div>
                        </label>
                        {{ form.badge_id }}
                        {{ form.badge_id.errors }}
                    </div>
                </div>
                {{ form.as_p }}
                <hr class="mt-5 mb-3 d-flex flex-row-reverse">
                <div class="col-lg-12 d-flex flex-row-reverse">
                    <button type="submit" class="oh-btn oh-btn--secondary">
                        {% trans "Save Changes" %}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
<script>
    $(document).ready(function () {
      var cropper = null;
      var image = document.getElementById('employeeImageToCrop');
      var cropBtn = document.getElementById('cropEmployeeIconBtn');
      var iconInput = document.getElementById('id_employee_profile');
      
      if (iconInput) {
          iconInput.classList.add("oh-input", "oh-input--file", "oh-input--file-sm", "mt-4");
      }

      $('#id_employee_profile').change(function (e) {
        const file = this.files[0];
        if (!file) return;
        const reader = new FileReader();

        reader.addEventListener("load", function() {
          if (cropper) { cropper.destroy(); }
          image.src = reader.result;
          cropper = new Cropper(image, {
              aspectRatio: 1,
              viewMode: 1,
              background: false,
          });
          if (cropBtn) cropBtn.style.display = 'block';
        });

        reader.readAsDataURL(file);
      });
      
      if (cropBtn) {
          $(cropBtn).click(function() {
              if (!cropper) return;
              var canvas = cropper.getCroppedCanvas({ width: 400, height: 400 });
              canvas.toBlob(function(blob) {
                  var fileName = iconInput.files[0] ? iconInput.files[0].name : 'profile.png';
                  var file = new File([blob], fileName, { type: 'image/png', lastModified: new Date().getTime() });
                  var container = new DataTransfer();
                  container.items.add(file);
                  iconInput.files = container.files;
                  
                  var mainPreview = document.querySelector('.oh-profile-section__edit-photo .preview');
                  if (mainPreview) { mainPreview.src = canvas.toDataURL('image/png'); }
                  
                  $('#uploadPhotoModal').removeClass('oh-modal--show');
              }, 'image/png');
          });
      }
    });
</script>
