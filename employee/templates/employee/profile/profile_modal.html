{% load i18n %}
<div
class="oh-modal"
id="uploadPhotoModal"
role="dialog"
aria-labelledby="uploadPhotoModal"
aria-hidden="true"
>
<div class="oh-modal__dialog">
  <div class="oh-modal__dialog-header">
    <span class="oh-modal__dialog-title" id="uploadPhotoModalLabel"
      >{% trans "Upload Photo" %}</span
    >
    <button class="oh-modal__close" aria-label="{% trans 'Close' %}">
      <ion-icon name="close-outline"></ion-icon>
    </button>
  </div>
  <div class="oh-modal__dialog-body">
    <div class="oh-profile-section__image-container">
      <form hx-post="{% url 'update-own-profile-image' %}"  method='post' id="file-form">
        {% csrf_token %}
        <div class="oh-profile-section__modal-avatar" style="max-height: 400px; width: 100%; display: flex; justify-content: center; align-items: center;">
          <img
          id="profileModalImageToCrop"
          src="{{form.instance.get_avatar}}"
          class="preview"
          style="max-width: 100%; max-height: 100%;"
          alt="{{ form.instance }}"
          />
        </div>
        <input type="file" name='employee_profile' id="id_employee_profile" class="oh-input oh-input--file oh-input--file-sm mt-4"  accept="image/*" />
        <div class="d-flex justify-content-end mt-4">
            <button type="button" id="cropProfileModalBtn" class="oh-btn oh-btn--secondary oh-btn--small w-100" style="display: none;">{% trans "Crop Image" %}</button>
        </div>
        <div class="d-flex justify-content-between w-100 align-items-center mt-4">
          <button class="oh-btn oh-btn--light-danger mr-1" hx-target='#personalMessage' hx-delete="{% url 'remove-own-profile-image' %}"><ion-icon class="me-1" name="trash-outline"></ion-icon>{% trans "Delete Image" %}</button>
          <button
          type="submit"
          class="oh-btn oh-btn--secondary oh-btn--shadow"
          >
          {% trans "Update Image" %}
        </button>
      </div>
    </form>
    </div>
    <script>
      $(document).ready(function () {
          var cropper = null;
          var image = document.getElementById('profileModalImageToCrop');
          var cropBtn = document.getElementById('cropProfileModalBtn');
          var iconInput = document.getElementById('id_employee_profile');

          $("#id_employee_profile").change(function (e) {
              const file = this.files[0];
              if (!file) return;
              const reader = new FileReader();

              reader.addEventListener("load", function () {
                  if (cropper) { cropper.destroy(); }
                  image.src = reader.result;
                  cropper = new Cropper(image, {
                      aspectRatio: 1,
                      viewMode: 1,
                      background: false,
                  });
                  if (cropBtn) cropBtn.style.display = 'block';
              });

              reader.readAsDataURL(file);
          });

          if (cropBtn) {
              $(cropBtn).click(function(e) {
                  e.preventDefault();
                  if (!cropper) return;
                  var canvas = cropper.getCroppedCanvas({ width: 400, height: 400 });
                  canvas.toBlob(function(blob) {
                      var fileName = iconInput.files[0] ? iconInput.files[0].name : 'profile.png';
                      var file = new File([blob], fileName, { type: 'image/png', lastModified: new Date().getTime() });
                      var container = new DataTransfer();
                      container.items.add(file);
                      iconInput.files = container.files;
                      
                      cropper.destroy();
                      cropper = null;
                      image.src = canvas.toDataURL('image/png');
                      cropBtn.style.display = 'none';
                      
                      var mainPreview = document.querySelector('.oh-profile-section__edit-photo .preview');
                      if (mainPreview) { mainPreview.src = canvas.toDataURL('image/png'); }
                  }, 'image/png');
              });
          }
      });
    </script>
  </div>
</div>
